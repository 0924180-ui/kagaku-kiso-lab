<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>復習 | 化学基礎ラボ</title>
<meta name="description" content="間違えた問題や復習リストに保存した問題を効率よく復習します。">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="review">

<header id="site-header"></header>

<main>
  <div class="container">
    <section class="page-header" aria-label="ページヘッダー">
      <div class="eyebrow">復習</div>
      <h1>間違えた問題を解き直そう</h1>
      <p class="lead">エビングハウスの忘却曲線を意識して、間違えた問題や復習リストの問題を定期的に解き直しましょう。</p>
    </section>

    <div class="segment" role="tablist" aria-label="復習モード切り替え">
      <button role="tab" id="tab-wrong" data-view="wrong" class="is-active" aria-selected="true" aria-controls="review-area">間違えた問題</button>
      <button role="tab" id="tab-saved" data-view="saved" aria-selected="false" aria-controls="review-area">復習リスト</button>
    </div>

    <section aria-label="復習問題リスト">
      <div id="review-area" role="tabpanel" aria-live="polite">
        <!-- JSで生成 -->
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="container">化学基礎ラボ — 大学受験に向けた化学基礎の学習サイト</div>
</footer>

<nav id="mobile-tabbar" aria-label="モバイルナビゲーション"></nav>

<script src="js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/mastery.js"></script>
<script src="js/supabase-sync.js"></script>
<script src="js/nav.js"></script>
<script src="js/review.js"></script>
</body>
</html>
